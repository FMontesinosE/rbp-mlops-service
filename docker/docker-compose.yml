version: "3.8"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/mlflow/mlruns
    working_dir: /mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root ./mlruns/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - rbp-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rbp-api
    ports:
      - "8000:8000"
    volumes:
      - ../mlruns:/app/mlruns:ro
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlruns/mlflow.db
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - rbp-network

networks:
  rbp-network:
    driver: bridge
